[project]
name = "aizynthfinder"
requires-python = ">=3.10.0,<3.13.0"
version = "4.4.2"
description = "Retrosynthetic route finding using neural network guided Monte-Carlo tree search"
readme = "README.md"
authors = [
    {name = "Molecular AI group", email = "samuel.genheden@astrazeneca.com"},
    ]
license = "MIT"
include = ["aizynthfinder/data/*.yml", "aizynthfinder/data/templates/*"]
homepage = "https://github.com/MolecularAI/aizynthfinder/"
repository = "https://github.com/MolecularAI/aizynthfinder/"
documentation = "https://molecularai.github.io/aizynthfinder/"
exclude-newer = "31 days"
prerelease = "allow"

dependencies = [
    "setuptools==70.2.0",
    # "dotenv==0.9.9",
    "python-dotenv==1.2.2",
    "pytorch-lightning",  # ==1.4.9,"
    "pyyaml",
    #  help: `pyyaml` (v5.4.1) was included because `aizynthfinder` (v4.4.2) depends on `pytorch-lightning` (v1.4.9) which depends on `pyyaml`
    # "torch",  
    # "torchmetrics==0.7.3",
    # "hydra-core>=1.3.2",  #  ">=1.3.2,<1.5.0",
    "fastapi>=0.98.0",  # ,<0.99.0",
    "pydantic>=1.10.26",  # ,<=2.0",
    "protobuf>=2.0,<3.21",

    "pandas",
    "ipython==8.39.0",
    "numpy==1.26.4",

    "rdkit~=2023.9",
    "ipywidgets>=7.5.1",
    "jinja2>=3.0",

    "jupyter",
    "jupytext",
    "notebook",
    "networkx",
    "deprecated~=1.2.10",
    "pillow~=12.0",
    "requests~=2.23",
    "rdchiral~=1.0",
    "tables~=3.6.1",
    "tqdm~=4.42",
    "onnxruntime~=1.23",
    "seaborn",
    "dask",
]

[project.optional-dependencies]
all = [
    "aizynthfinder[dev,service,tf]",
    ]
dev = [
    "invoke",
    "pytest",
    "pytest-black",
    "pytest-cov",
    "pytest-datadir",
    "pytest-mock",
    "pytest-mccabe",
    "Sphinx",
    "mypy",
    "pylint",
]
service = [
    "fastapi==0.98.0",
    "pydantic==1.10.26",
    "uvicorn[standard]>=0.22.0",
    "google-cloud-storage>=2.0,<3.0",
    "pymongo", "route-distances", "scipy", "timeout-decorator", "molbloom"
    ]
tf = ["tensorflow", "grpcio", "tensorflow-serving-api"]

[project.scripts]
aizynthapp = "aizynthfinder.interfaces.aizynthapp:main"
aizynthcli = "aizynthfinder.interfaces.aizynthcli:main"
cat_aizynth_output = "aizynthfinder.tools.cat_output:main"
download_public_data = "aizynthfinder.tools.download_public_data:main"
smiles2stock = "aizynthfinder.tools.make_stock:main"

[tool.pytest.ini_options]
mccabe-complexity = 9

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
max-args = 8
max-attributes = 20
min-public-methods = 0
disable = "C0116, E0401, E1101, I1101, R0801, R0902, R0903, R0914, R1732, R1735, W0221, W0237, W0406, W0602, W0603, W0707, W1201, W1203, W1514, W3101"

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:"
]

[tool.coverage.run]
relative_files = true

[tool.black]
line-length = 120

[tool.uv_build]
source-dir = "src"

[build-system]
requires = ["uv_build>=0.11.0", "setuptools"]
build-backend = "uv_build"

